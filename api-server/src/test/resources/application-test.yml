spring:
  datasource:
    url: jdbc:h2:mem:ppt_agent_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

ppt:
  cos:
    region: ap-guangzhou
    bucket: test-bucket
    secret-id: test-secret-id
    secret-key: test-secret-key
    public-base-url: https://cos.example.test
    mock-enabled: true
    mock-fail-upload: false
  files:
    max-upload-size: 1MB
    presigned-upload-ttl: 5m
  agent:
    default-model: mock-llm
    max-plan-slides: 12
    default-checkpoint-max-iterations: 3
    memory-compression-threshold-chars: 220
    recent-message-limit: 8
    mock-llm-enabled: true
    mcp-tools-enabled: true
    mock-bailian-enabled: true
    bailian-api-key:
    qwen-base-url: https://dashscope.example.test/compatible-mode/v1
    image-generation-url: https://dashscope.example.test/api/v1/services/aigc/multimodal-generation/generation
    image-model: qwen-image-2.0-pro
    image-size: 2688*1536
    request-timeout-seconds: 2
  jwt:
    issuer: ppt-agent-platform-test
    secret: test-secret-test-secret-test-secret-test-secret
    access-token-ttl: 1s
    refresh-token-ttl: 7d
