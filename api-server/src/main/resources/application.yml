spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: ppt-agent-platform
  datasource:
    url: ${PPT_MYSQL_URL:jdbc:mysql://localhost:3306/ppt_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${PPT_MYSQL_USERNAME:root}
    password: ${PPT_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${PPT_REDIS_HOST:localhost}
      port: ${PPT_REDIS_PORT:6379}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ppt:
  cos:
    region: ${TENCENT_COS_REGION:}
    bucket: ${TENCENT_COS_BUCKET:}
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    public-base-url: ${TENCENT_COS_PUBLIC_BASE_URL:}
    mock-enabled: ${PPT_COS_MOCK_ENABLED:true}
    mock-fail-upload: ${PPT_COS_MOCK_FAIL_UPLOAD:false}
  files:
    max-upload-size: ${PPT_FILE_MAX_UPLOAD_SIZE:20MB}
    presigned-upload-ttl: ${PPT_FILE_PRESIGNED_UPLOAD_TTL:10m}
  redis:
    namespace: ppt-agent
    collaboration-topic: ppt-agent:collaboration
    rag-index-name: ppt-agent:rag:images
  collaboration:
    websocket-endpoint: /ws/presentations
    snapshot-interval-seconds: 30
    yjs-persistence-enabled: true
  agent:
    default-model: ${PPT_AGENT_DEFAULT_MODEL:qwen-plus}
    generation:
      worker-count: ${PPT_AGENT_GENERATION_WORKER_COUNT:4}
      queue-capacity: ${PPT_AGENT_GENERATION_QUEUE_CAPACITY:100}
      dispatch-interval-ms: ${PPT_AGENT_GENERATION_DISPATCH_INTERVAL_MS:250}
      lease-scan-interval-ms: ${PPT_AGENT_GENERATION_LEASE_SCAN_INTERVAL_MS:1000}
    max-plan-slides: 20
    default-checkpoint-max-iterations: ${PPT_AGENT_CHECKPOINT_MAX_ITERATIONS:5}
    memory-compression-threshold-chars: ${PPT_AGENT_MEMORY_COMPRESSION_THRESHOLD_CHARS:1600}
    recent-message-limit: ${PPT_AGENT_RECENT_MESSAGE_LIMIT:12}
    mock-llm-enabled: ${PPT_AGENT_MOCK_LLM_ENABLED:true}
    mcp-tools-enabled: ${PPT_AGENT_MCP_TOOLS_ENABLED:true}
    mock-bailian-enabled: ${PPT_AGENT_MOCK_BAILIAN_ENABLED:true}
    bailian-api-key: ${PPT_AGENT_BAILIAN_API_KEY:${DASHSCOPE_API_KEY:}}
    qwen-base-url: ${PPT_AGENT_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    image-generation-url: ${PPT_AGENT_BAILIAN_IMAGE_GENERATION_URL:https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
    image-model: ${PPT_AGENT_BAILIAN_IMAGE_MODEL:qwen-image-2.0-pro}
    image-size: ${PPT_AGENT_BAILIAN_IMAGE_SIZE:2688*1536}
    request-timeout-seconds: ${PPT_AGENT_BAILIAN_REQUEST_TIMEOUT_SECONDS:60}
  events:
    relay-interval-ms: ${PPT_AGENT_EVENTS_RELAY_INTERVAL_MS:250}
  jwt:
    issuer: ppt-agent-platform
    secret: ${PPT_JWT_SECRET:change-me-change-me-change-me-change-me}
    access-token-ttl: ${PPT_JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${PPT_JWT_REFRESH_TTL:7d}
